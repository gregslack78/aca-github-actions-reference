# Generated by _authoring/render_workflows.py; edit samples/.github/workflows instead.
name: Roll back to an existing revision
on:
  workflow_dispatch:
    inputs:
      target:
        description: Application to roll back
        required: true
        default: private
        type: choice
        options: [private, demo]
      revision:
        description: Existing revision name from the approved release record
        required: true
        type: string
defaults:
  run:
    shell: bash
    working-directory: samples
permissions: {}
env:
  AZURE_EXTENSION_DIR: /opt/azure-cli-extensions
jobs:
  rollback:
    if: github.ref == 'refs/heads/main' && vars.DEPLOYMENT_ENABLED == 'true'
    environment: production
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNNER_LABELS) }}
    timeout-minutes: 15
    concurrency:
      group: production-${{ vars.ACA_APP }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ACA_APP: ${{ vars.ACA_APP }}
      ACA_RESOURCE_GROUP: ${{ vars.ACA_RESOURCE_GROUP }}
      REVISION: ${{ inputs.revision }}
    steps:
      - name: Isolate per-job credentials
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'AZURE_CONFIG_DIR=%s\n' "$(mktemp -d "$RUNNER_TEMP/azure.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select rollback target
        env:
          TARGET: ${{ inputs.target }}
          DEMO_ENABLED: ${{ vars.DEMO_DEPLOYMENT_ENABLED }}
          DEMO_APP: ${{ vars.DEMO_ACA_APP }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            private) ;;
            demo)
              if [[ "$DEMO_ENABLED" != true || -z "$DEMO_APP" ]]; then
                echo "::error::The browser demo is not enabled or configured"
                exit 1
              fi
              printf 'ACA_APP=%s\n' "$DEMO_APP" >> "$GITHUB_ENV"
              ;;
            *) echo "::error::Select private or demo"; exit 1 ;;
          esac
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Restore selected revision
        run: bash scripts/rollback.sh
      - name: Remove per-job credentials
        working-directory: ${{ runner.temp }}
        if: always() && env.AZURE_CONFIG_DIR != ''
        run: rm -rf -- "$AZURE_CONFIG_DIR"
