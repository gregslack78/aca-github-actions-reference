<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" role="img" aria-labelledby="title desc">
<title id="title">GitHub Actions to private Azure Container Apps reference architecture</title>
<desc id="desc">GitHub repository and environments, Entra OIDC federation, VMSS or ACA Jobs runner options, private ACR and ACA, DNS and egress.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker></defs>
<rect width="100%" height="100%" fill="white"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#0f172a}.title{font-size:27px;font-weight:700}.heading{font-size:17px;font-weight:700}.body{font-size:14px}.edge{font-size:12px;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}</style>
<text x="25" y="40" class="title">GitHub Actions to private Azure Container Apps</text>
<text x="25" y="65" class="body">Reference design for the GitHub and Entra setup | not a deployed environment</text>
<rect x="20" y="100" width="440" height="510" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2" stroke-dasharray="7 4"/>
<text x="36" y="128" class="heading">GITHUB | private repository</text>
<rect x="500" y="285" width="940" height="505" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" stroke-dasharray="7 4"/>
<text x="516" y="313" class="heading">AZURE | customer-owned private network</text>
<rect x="520" y="335" width="540" height="245" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="7 4"/>
<text x="536" y="363" class="heading">RUNNERS | choose option A or B</text>
<rect x="45" y="150" width="390" height="120" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
<text x="59" y="177" class="heading">1  Repository</text>
<text x="59" y="203" class="body">App team&#x27;s repo: app code + pipeline files</text>
<text x="59" y="226" class="body">Recommended: protect main with a ruleset</text>
<text x="59" y="249" class="body">Recommended: CODEOWNERS on pipeline files</text>
<rect x="45" y="300" width="390" height="150" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
<text x="59" y="327" class="heading">2  Workflows + environments</text>
<text x="59" y="353" class="body">build environment: main only, publishes image</text>
<text x="59" y="376" class="body">production environment: main only + approval</text>
<text x="59" y="399" class="body">Each job gets a short-lived OIDC token</text>
<text x="59" y="422" class="body">Token subject = repository + environment</text>
<rect x="45" y="480" width="390" height="100" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
<text x="59" y="507" class="heading">3  Pull request checks</text>
<text x="59" y="533" class="body">GitHub-hosted runner, read-only token</text>
<text x="59" y="556" class="body">No Azure identity, no private network</text>
<rect x="20" y="640" width="440" height="120" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
<text x="34" y="667" class="heading">Platform team provides</text>
<text x="34" y="693" class="body">Existing ACR, ACA, VNets, DNS and egress</text>
<text x="34" y="716" class="body">Bootstraps Entra apps, RBAC and runners</text>
<rect x="520" y="100" width="430" height="150" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="534" y="127" class="heading">4  Microsoft Entra ID</text>
<text x="534" y="153" class="body">Two app registrations: build and deploy</text>
<text x="534" y="176" class="body">One federated credential per environment</text>
<text x="534" y="199" class="body">Trusts issuer + audience + exact subject</text>
<text x="534" y="222" class="body">No client secret stored in GitHub</text>
<rect x="990" y="100" width="430" height="150" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="1004" y="127" class="heading">5  Azure RBAC</text>
<text x="1004" y="153" class="body">Build identity: push images to ACR</text>
<text x="1004" y="176" class="body">Deploy identity: update the one ACA app</text>
<text x="1004" y="199" class="body">No subscription-wide roles</text>
<text x="1004" y="222" class="body">Sign-in and ARM use public HTTPS</text>
<rect x="540" y="385" width="240" height="175" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="554" y="412" class="heading">6A  VMSS runners</text>
<text x="554" y="438" class="body">15 build + 2 deploy VMs</text>
<text x="554" y="461" class="body">Docker on build VMs only</text>
<text x="554" y="484" class="body">Persistent; trusted code</text>
<text x="554" y="507" class="body">Fixed or scheduled capacity</text>
<rect x="800" y="385" width="240" height="175" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="814" y="412" class="heading">6B  ACA Jobs runners</text>
<text x="814" y="438" class="body">One ephemeral job per runner</text>
<text x="814" y="461" class="body">KEDA scales 0-15 / 0-2</text>
<text x="814" y="484" class="body">No Docker; builds go to 8</text>
<text x="814" y="507" class="body">PAT in Key Vault (bootstrap)</text>
<rect x="1130" y="335" width="290" height="130" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1144" y="362" class="heading">7  Existing ACR (private)</text>
<text x="1144" y="388" class="body">Private endpoint; public off</text>
<text x="1144" y="411" class="body">Images referenced by digest</text>
<text x="1144" y="434" class="body">App pull identity: pull only</text>
<rect x="1130" y="500" width="290" height="105" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="1144" y="527" class="heading">8  ACR Tasks pool (B)</text>
<text x="1144" y="553" class="body">VNet-connected; preview feature</text>
<text x="1144" y="576" class="body">Runs Docker builds for option B</text>
<rect x="1130" y="625" width="290" height="155" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
<text x="1144" y="652" class="heading">9  Existing ACA (private)</text>
<text x="1144" y="678" class="body">Internal environment</text>
<text x="1144" y="701" class="body">Stage new revision, no traffic</text>
<text x="1144" y="724" class="body">Private smoke test, then promote</text>
<text x="1144" y="747" class="body">Old revision kept for rollback</text>
<rect x="520" y="610" width="540" height="110" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<text x="534" y="637" class="heading">10  Private DNS + controlled egress</text>
<text x="534" y="663" class="body">ACR, Key Vault and ACA names resolve privately</text>
<text x="534" y="686" class="body">Outbound HTTPS: GitHub, Entra, ARM, packages</text>
<path d="M435,375 L480,375 L480,175 L520,175" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
<text x="472.0" y="275.0" text-anchor="middle" class="edge" transform="rotate(-90 472.0 275.0)">OIDC trust</text>
<path d="M950,175 L990,175" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
<text x="970.0" y="167.0" text-anchor="middle" class="edge">RBAC</text>
<path d="M435,440 L520,440" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 4"/>
<text x="477.5" y="432.0" text-anchor="middle" class="edge">outbound poll</text>
<path d="M1060,400 L1130,400" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1095.0" y="392.0" text-anchor="middle" class="edge">push image</text>
<path d="M1060,540 L1130,540" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 4"/>
<text x="1095.0" y="532.0" text-anchor="middle" class="edge">B: build</text>
<path d="M1275,500 L1275,465" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 4"/>
<text x="1267.0" y="482.5" text-anchor="middle" class="edge" transform="rotate(-90 1267.0 482.5)">push</text>
<path d="M1420,400 L1460,400 L1460,700 L1420,700" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1452.0" y="550.0" text-anchor="middle" class="edge" transform="rotate(-90 1452.0 550.0)">managed identity pull</text>
<path d="M1060,565 L1095,565 L1095,700 L1130,700" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1087.0" y="632.5" text-anchor="middle" class="edge" transform="rotate(-90 1087.0 632.5)">deploy + smoke test</text>
<text x="25" y="820" class="heading">Legend</text>
<text x="25" y="847" class="body">Purple: identity / management plane   |   Blue: option A (VMSS)   |   Orange dashed: option B (ACA Jobs + ACR Tasks)</text>
<text x="25" y="872" class="body">Green: private registry / application   |   Gray dashed: supporting flow   |   No inbound GitHub webhook required</text>
</svg>