name: Unprivileged pull request checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test hello world
        run: python3 -m unittest discover -s app -v
      - name: Verify container builds, without Azure access
        run: docker build --build-arg APP_COMMIT="$GITHUB_SHA" -t hello:pr .
  demo-access-boundary:
    if: github.ref == 'refs/heads/main' && vars.DEMO_DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Verify configured demo internet access
        working-directory: ${{ runner.temp }}
        env:
          DEMO_FQDN: ${{ vars.DEMO_APP_FQDN }}
          DEMO_PUBLIC_ACCESS: ${{ vars.DEMO_PUBLIC_ACCESS }}
        run: |
          set -euo pipefail
          [[ "$DEMO_FQDN" =~ ^[a-zA-Z0-9.-]+\.azurecontainerapps\.io$ ]]
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 60 \
            --output /dev/null --write-out '%{http_code}' "https://$DEMO_FQDN/")
          expected=403
          if [[ "$DEMO_PUBLIC_ACCESS" == true ]]; then expected=200; fi
          if [[ "$status" != "$expected" ]]; then
            echo "::error::Expected HTTP $expected for the configured demo access mode; received $status"
            exit 1
          fi
          echo "Confirmed: an internet client receives HTTP $expected"
