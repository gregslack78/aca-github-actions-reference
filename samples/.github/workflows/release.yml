name: Build once and deploy immutable image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
env:
  AZURE_EXTENSION_DIR: /opt/azure-cli-extensions
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    environment: build
    runs-on: ${{ fromJSON(vars.BUILD_RUNNER_LABELS) }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      ACR_NAME: ${{ vars.ACR_NAME }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
      BUILD_MODE: ${{ vars.BUILD_MODE }}
      ACR_AGENT_POOL: ${{ vars.ACR_AGENT_POOL }}
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Isolate per-job credentials
        shell: bash
        run: |
          set -euo pipefail
          printf 'AZURE_CONFIG_DIR=%s\n' "$(mktemp -d "$RUNNER_TEMP/azure.XXXXXX")" >> "$GITHUB_ENV"
          printf 'DOCKER_CONFIG=%s\n' "$(mktemp -d "$RUNNER_TEMP/docker.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s app -v
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build, push and resolve digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}"
          case "$BUILD_MODE" in
            vmss)
              az acr login --name "$ACR_NAME" --output none
              docker build --build-arg APP_COMMIT="$GITHUB_SHA" \
                -t "$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$tag" .
              docker push "$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$tag"
              ;;
            acr-task)
              : "${ACR_AGENT_POOL:?Set ACR_AGENT_POOL for private remote builds}"
              az acr build --registry "$ACR_NAME" --agent-pool "$ACR_AGENT_POOL" \
                --image "$IMAGE_REPOSITORY:$tag" --file Dockerfile \
                --build-arg APP_COMMIT="$GITHUB_SHA" .
              ;;
            *) echo "::error::BUILD_MODE must be vmss or acr-task"; exit 1 ;;
          esac
          digest=$(az acr repository show --name "$ACR_NAME" \
            --image "$IMAGE_REPOSITORY:$tag" --query digest --output tsv)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY@$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          jq -n --arg image "$image" --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" '{image:$image,commit:$commit,run:$run}' > release.json
          printf 'Image: `%s`\nCommit: `%s`\n' "$image" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release.json
          retention-days: 30
          if-no-files-found: error
      - name: Remove per-job credentials
        if: always() && env.AZURE_CONFIG_DIR != ''
        shell: bash
        run: |
          rm -rf -- "$AZURE_CONFIG_DIR" "$DOCKER_CONFIG"
  deploy:
    needs: build
    environment: production
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNNER_LABELS) }}
    timeout-minutes: 20
    concurrency:
      group: production-${{ vars.ACA_APP }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ACA_APP: ${{ vars.ACA_APP }}
      ACA_RESOURCE_GROUP: ${{ vars.ACA_RESOURCE_GROUP }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
      IMAGE: ${{ needs.build.outputs.image }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Isolate per-job credentials
        shell: bash
        run: |
          set -euo pipefail
          printf 'AZURE_CONFIG_DIR=%s\n' "$(mktemp -d "$RUNNER_TEMP/azure.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reject stale commits
        shell: bash
        run: |
          set -euo pipefail
          head=$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er .object.sha)
          [[ "$head" == "$GITHUB_SHA" ]] || {
            echo "::error::A newer main commit exists; deploy that run instead"; exit 1;
          }
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Stage, smoke test and promote
        shell: bash
        run: bash scripts/deploy.sh
      - name: Remove per-job credentials
        if: always() && env.AZURE_CONFIG_DIR != ''
        run: rm -rf -- "$AZURE_CONFIG_DIR"
