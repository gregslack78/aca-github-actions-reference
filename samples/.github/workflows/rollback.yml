name: Roll back to an existing revision
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Existing revision name from the approved release record
        required: true
        type: string
permissions: {}
env:
  AZURE_EXTENSION_DIR: /opt/azure-cli-extensions
jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ${{ fromJSON(vars.DEPLOY_RUNNER_LABELS) }}
    timeout-minutes: 15
    concurrency:
      group: production-${{ vars.ACA_APP }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      ACA_APP: ${{ vars.ACA_APP }}
      ACA_RESOURCE_GROUP: ${{ vars.ACA_RESOURCE_GROUP }}
      REVISION: ${{ inputs.revision }}
    steps:
      - name: Isolate per-job credentials
        shell: bash
        run: |
          set -euo pipefail
          printf 'AZURE_CONFIG_DIR=%s\n' "$(mktemp -d "$RUNNER_TEMP/azure.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Restore selected revision
        run: bash scripts/rollback.sh
      - name: Remove per-job credentials
        if: always() && env.AZURE_CONFIG_DIR != ''
        run: rm -rf -- "$AZURE_CONFIG_DIR"
